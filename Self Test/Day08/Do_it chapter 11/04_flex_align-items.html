<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>플렉스 박스에서 교차축 정렬 방법 지정하기</title>

    <style>
        .container{
            width: 700px;
            height: 200px;
            display: flex;
            background-color: #eee;
            border: 1px solid black;
            margin-bottom: 30px;
        }
        .container>div{
            width: 100px;
            background-color: aqua;
            padding: 20px;
            margin: 2px;
        }
    </style>
</head>
<body>
    <div class="container" id="opt1">
        <div>1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
    </div>
     <div class="container" id="opt2">
        <div>1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
    </div>
     <div class="container" id="opt3">
        <div>1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
    </div>
     <div class="container" id="opt4">
        <div>1</div>
        <div>2</div>
        <div><h3>3</h3></div>
        <div>4</div>
    </div>
     <div class="container" id="opt5">
        <div>1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>

    <style>
        #opt1{align-items: flex-start;}
        #opt2{align-items: flex-end;}
        #opt3{align-items: center;}
        #opt4{align-items: baseline;}
        #opt5{align-items: stretch;}
    </style>
</body>
</html>
