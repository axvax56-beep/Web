<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Object-fit 속성으로 이미지 크기 조절하기</title>

    <style>

        div{
            display: inline-block;
            width: 50px;
            height: 100px;
            border: 1px solid black;
            margin: 10px;
        }

        img{
            width: 50px;
            height: 100px;
        }
        .fill{object-fit: fill;}
        .contain{object-fit: contain;}
        .cover{object-fit: cover;}
        .none{object-fit: none;}
        .scale-down{object-fit: scale-down;}
    </style>

</head>
<body>
    <div>
        <img src="./image/btf.jpg" alt="영화" class="fill">
    </div>
    <div>
        <img src="./image/btf.jpg" alt="영화" class="contain">
    </div>
    <div>
        <img src="./image/btf.jpg" alt="영화" class="cover">
    </div>
    <div>
        <img src="./image/btf.jpg" alt="영화" class="none">
    </div>
    <div>
        <img src="./image/btf.jpg" alt="영화" class="scale-down">
    </div>
</body>
</html>
