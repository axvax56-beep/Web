<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mobile ui 1</title>

     <link rel="stylesheet" href="./mobileUI1.css">
</head>
<body>
    <div id="header">
        <div class="toolbar">
            <img class="toolbar-img" src="./image/back.png" alt="back">
            <button class="toolbar-btn">문의하기</button>
        </div>

        <h2>
            이님,<br>
            <span>2018년부터 2022년 사이</span><br>
            해당하는 항목을 선택해 주세요
        </h2>
        <div class="options">
            <div class="option">
                <img src="./image/man.png" alt="Gajang">
                <p>부양가족이 있어요 <br>
                <span>필수로 입력해야 해요</span></p>
                <div class="option-btn"></div>
            </div>

            <div class="option2">
                <img src="./image/house.png" alt="house">
                <p>월세에 살았어요</p>
            </div>

            <div class="option2">
                <img src="./image/heart.png" alt="donation">
                <p>기부를 했어요</p>
            </div>
    </div>

    <button class="complete-btn">1개 선택 완료</button>
</body>
</html>
