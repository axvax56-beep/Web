<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>박스 모델의 테두리 두께 지정하기</title>
        <style>
            .box1{ border-style: solid; border-width: 2px;}
            .box2{ border-width: thick thin; border-style: solid;}
            .box3{ border-width: thick thin thin; border-style: solid;}
            .box4{ border-width: 10px 5px 5px 10px; border-style: solid;}
        </style>
    </head>
    <body>
        <div class="box1">a</div>
        <div class="box2">b</div>
        <div class="box3">c</div>
        <div class="box4">d</div>
    </body>
</html>
