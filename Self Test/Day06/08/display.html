<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>목록을 사용해 세로 내비게이션 만들기</title>
        <style>
            nav > ul { list-style: none;}
            nav ul li{
                display: inline-block;
                width: 100px;
                height: 40px;
                line-height: 40px;
                text-align: center;
                margin: 10px;
                border: 1px solid #222;
            }
            a {text-decoration: none;}
        </style>
    </head>
    <body>
        <nav>
            <ul>
                <li><a href="#"></a> 메뉴1</li>
                <li><a href="#"></a> 메뉴2</li>
                <li><a href="#"></a> 메뉴3</li>
                <li><a href="#"></a> 메뉴4</li>
            </ul>
        </nav>    
    </body>
</html>
