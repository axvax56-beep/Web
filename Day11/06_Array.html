<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array object</title>
    <script>
        //5. Array

        // 이미 배열수업에 배열다루는 것은 배웠음
        var aaa = new Array(10,20,30);
        document.write(typeof(aaa) + '<br>') //object

        // 배열 객체가 가지고 있는 유용한 기능(function - 함수 - method)
        // 1. 배열요소의 값들을, 구분자로 하여 하나의 문자열로 만들어주는 기능
        document.write(aaa.toString() +'<br>' ); //toString()은 직접 쓰는 경우는 별로 없음 why? 배열 참조변수를 출력하면 자동 toString()해줌 

        // 2. 다른 배열을 이어 붙인 새로운 배열을 만들어주는 기능
        var bbb=[4,5,6];
        var ccc = aaa.concat(bbb); // 원본 aaa는 바뀌지 않음
        document.write(ccc + '<br>');
        document.write(aaa + '<br>');

        // 파이썬의 리스트처럼 + 결합연산이 될까> -> NO. 그러나 에러는 아님 -> 각 배열을 문자열로 변환 후 문자열 결합을 해버림
        var ddd = aaa + bbb
        document.write(ddd + '<br>');
        document.write(typeof(ddd)+ '<br>');

        document.write('<hr>');

        // 3. indexOf: 특정 값이 몇번 위치에 있는지? -> 인덱스 번호
        document.write(aaa.indexOf(30) + '<br>');
        document.write(aaa.indexOf(40) + '<br>');
        document.write(aaa.indexOf(10, 1) + '<br>'); // (a, n): a를 n번방 이후부터 찾아라
        document.write('<hr>')

        // 4. push, pop (stack 구조)
        var stack = [1,2,3,4,5,6,7];
        stack.push(10); // 마지막에 10이 추가됨
        document.write(stack + '<br>')

        // 마지막 요소를 빼오기 (실제 배열에 변화가 생김)
        var e = stack.pop();
        document.write(e + '<br>')
        document.write(stack + '<br>')

        // 5. push, shift (queue 구조)
        var queue =[1,2,3,4,5];
        queue.push(10);
        document.write(queue+'<br>');

        var e = queue.shift(); //첫번째 요소 빼오기ㅣ
        document.write(e +'<br>')
        document.write(queue + '<br>')
        document.write('<hr>')

        // 6. reverse: 배열의 저장 순서를 뒤집기 (원본이 변경됨)
        var aaa = [10,20,30,40,50];
        aaa.reverse();
        document.write(aaa+'<hr>')

        // 7. slice: 배열의 일부분을 잘라서 새로운 배열로 리턴 (원본 불변)
        var aaa = [10,20,30,40,50,60,70,80,90];
        var bbb = aaa.slice(3); //3번 위치부터 잘라서 새로운 배열로 리턴
        document.write(bbb + '<br>');

        var ccc = aaa.slice(3, 6) // 3번부터 6번 전까지 잘라서 새로운 배열 리턴
        document.write(ccc + '<hr>')

        // 8. join: 배열의 요소를 특정문자를 구분자로 하여 하나의 문자열로 리턴(string의 split의 정반대 기능)
        var aaa = ['sam', 'robin', 'hong'];
        var bbb = aaa.join(" & "); "sam&robin&hong"
        document.write(bbb + '<hr>');

        // 9. sort: 정렬 (원본 변경됨)
        var aaa= [3,5,4,8,7,1,9,6];
        aaa.sort();
        document.write(aaa + '<br>')

        // 두자리 이상 숫자를 정렬해보면

        var aaa = [21, 6457, 234, 96, 2, 49];
        aaa.sort(); // 숫자를 자리수끼리 비교하면서 배열됨
        document.write(aaa + '<br>')

        // 정렬을 하는 기준을 결정하는 함수를 이용 (정렬기준함수)
        aaa.sort( function(a,b){ //오름차순
            return a-b;
        });
        document.write(aaa + '<br>');

        aaa.sort( function(a,b){ //내림차순
            return b-a;
        });
        document.write(aaa + '<br>');

        document.write('<hr>')

        // 10. filter: 필터지정함수를 활용(필터의 기준을 정하는 함수)
        var scores = [90,75,68,42,78,29,100,88,56];
        // 80점 이상의 점수만 뽑아서 새로운 배열로 만들어내기
        var good_scores = scores.filter(function(e,index,array){ //(값, 인덱스번호, 배열)
            //필터 조건 -> 이 조건이 true인 요소들만 새 배열에 포함됨
            //return e >= 80;
            return e >= 80 && index>3; //80점 이상이면서 인덱스번호가 3번보다 큰것들
        });
        document.write(good_scores + '<br>')
        document.write('<hr>');

        // ECMAScript5 버전에서 새로 추가된 기능들
        var aaa = [10,20,30,40,50];

        // 11. 각각의 배열 요소들에 접근하는 반복기능을 제공
        aaa.forEach( function(e,index,array){
            document.write(e + ":" + index + ":"+ array.length + '<br>');
        })

        // 12. forEach 처럼 각 요소개수만큼 전달한 함수를 실행해주며 리턴을 통해 새로운 배열을 만들어줌
        // aaa 배열의 요소들 마다 x2를 한 새로운 배열 만들기
        var bbb = aaa.map(function(e, idx, array){
            return e*2;
        });
        document.write(bbb +'<br>')
        // .map()은 원본 배열을 가지고 조작하여 새로운 배열을 만들때 매우 유용. 많이 사용함
        
        // .map()에 전달한 함수의 파라미터 개수는 최대 3개(값, 인덱스 번호, 배열)이며 순서가 정해져 있음
        // 변수명은 바꿔도 되며 필요한 것만 사용해도 됨
        var bbb = aaa.map(function(e){ // 요소(element)만 쓰기 때문에 나머지는 지워도 됨
            return e*2;
            });
        document.write(bbb +'<br>')

    </script>
</head>
<body>
    
</body>
</html>
