<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> 사용자 정의 객체
    </title>
    <script>
        // JS에서 사용자 정의 객체를 만드는 2가지 방법
        // 1. 리터럴 객체: 객체를 생성하면서 멤버를 설계하는 방식
        var person={
            // 멤버변수 - 속성 property
            name:'sam',
            age:20,
            // 멤버함수 - 메소드 method
            show: function(){
                document.write('show..<br>')
                //멤버변수들을 출력해보기
                //document.write('show: ' + name + ', ' + age + '<br>'); // error
                //JS에서는 객체안에서 멤버를 지칭할때는 반드시 this 키워드 필요(파이선 self와 비슷)
                document.write('show: ' + this.name + ", " + this.age +"<br>" );
            }
        }

        // 객체를 그대로 출력하면 멤버값들이 출력되지 않음
        document.write(person + '<br>');

        // 멤버변수 출력
        document.write( 'name: ' + person.name + '<br>');
        document.write('age: ' + person.age + '<br>');

        // 멤버함수 호출
        person.show()
        document.write('<br>')

        // 새로운 객체 생성하기
        var person2 = {
            name:'robin',
            age: 25,
            show: function(){
                document.write('show: ' + this.name + ',' + this.age + '<br>');
            },
            add:function(x, y){
                document.write('add: ' + (x+y) + '<br>')
            }
        }

        person2.show()
        person2.add(50, 30);

        //JS는 매우 유연한 언어여서 객체를 생성한 후에 멤버를 새로이 추가할 수 있음
        person.address='seoul';
        document.write('주소: ' + person.address + '<br>')

        // 기존에 만들었던 show() 멤버함수는 (이름, 나이)만 출력해줌
        // person객체에 새로이 멤버함수를 추가하기
        person.output = function(){
            document.write('out: ' + this.name + ', ' + this.age + " - " + this.address + '<br>')
        }
        person.output(); // 함수 호출

        //존재하지 않는 멤버를 사용하려할때 변수와 함수가 약간 다름
        document.write( person.tel); // undefined
        // person.display(); //error

        document.write('<hr>');

        // 세번째, 네번째 객체를 만들려면 또 멤버들을 설계해야함
        // 비효율적이기에 미리 멤버구조를 설계하고 설계대로 객체를 생성하는 문법

        //-------------------------------------------------------------------------------

        // 2. 생성자 함수: 멤버구조 설계도를 미리 작성하고 new 키워드로 객체를 생성하는 방식

        // 이름, 나이, 전공 데이터를 저장하는 객체의 멤버구조를 설계
        function Student(name='익명', age='불명', major='전공미선택'){// 첫글자를 대문자로 쓰는 것을 권장.(일반함수와 구별하기 용이)
            //멤버 변수 - property
            this.name = name;
            this.age = age;
            this.major = major;

            //멤버 함수 - method
            this.show = function(){
                document.write('student show: ' + this.name + ',' + this.age + "," + this.major + '<br>');
            }
        }

        // 위 설계대로 객체를 생성하기
        var stu = new Student();
        stu.show();

        // 두번째 학생 객체 생성하기
        var stu2 = new Student();
        // 기존에 있던 멤버변수값 변경해주기
        stu2.name = 'robin'
        stu2.age = 25
        stu2.major = 'AI'
        stu2.show()

        // 세번째 학생객체를 생성할때도 멤버변수값을 하나씩 넣기 짜증
        // 객체를 생성할때 값을 전달하여 그 값으로 생성되도록
        var stu3 = new Student('hong', 23, 'ML')

        //존재하지 않는 멤버를 사용하면 undefined 거나 에러
        //그래서 안전하게 사용하려면 객체 안에 그 멤버가 있는지 확인 후 사용
        if('name' in stu){
            document.write('name 멤버변수가 있어요')
        }
        if( 'tel' in stu){
            document.write('tel 멤버변수가 있어요')
        }
        document.write('<br>')

        var flight = {
            airline:'korean air',
            number: 777,
            arrival: {
                nation:'japan',
                city: 'tokyo'
            }
        }
        document.write(flight.arrival.nation)
        document.write('<br>')

        // 변수는 크게 2종류가 존재함
        // 1. 기초타입 변수: 데이터를 저장하고 있는 변수
        var a= 10;
        var b;
        b = a; // 복사
        document.write('a: ' + a + '<br>');
        document.write('b: ' + b + '<br');

        b= 20; // 복사했기에 b를 바꿔도 a는 상관없음
        document.write('a: ' + a + '<br>');
        document.write('b: ' + b + '<br>');

        // 2. 참조타입 변수: 객체의 메모리 주소(위치)를 저장하여 이를 통해 제어하는 변수
        var p1 = {
            name:'aaa',
            age:20,
            show:function(){
                document.write('show: ' + this.name + ' : ', this.age + '<br>')
            }
        }
        
        var p2;
        p2 = p1; // 공유
        p1.show();
        p2.show();

        p2.name = 'bbb' // 공유하고 있기에 p2를 바꾸면 p1도 바뀜(얕은 복사)

        // 깊은 복사를 하려면 객체 자체를 복제(create) 해야 함
        // 이 복제기능은 JS에 내장된 Object 라는 녀석(생성자 함수)이 가지고 있음

        var p3= Object.create(p1); // p1을 복제한 새로운 객체를 생성
        p1.show();
        p3.show();

        p3.name = 'ccc'; // 공유한게 아니라 복제했기에 p3만 바뀜
        p1.show();
        p3.show();

        document.write('<hr>')

        //객체마다 멤버함수를 가지고 있으면 메모리 공간을 비효율적으로 사용하게 됨
        //그래서 특정 객체가 공유할 수 있는 함수를 등록하는 문법
        //prototype

        function User(name, age){
            this.name = name;
            this.age = age;
        }

        //User 객체들이 멤버함수인것처럼 사용할 수 있는 함수를 등록

        User.prototype.show = function(){
            document.write('user: ' + this.name + " : ", + this.age + '<br>');
        }

        var u1 = new User('sam', 20);
        var u2 = new User('robin', 25);

        u1.show();
        u2.show();
    </script>
</head>
<body>
    
</body>
</html>
