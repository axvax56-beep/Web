<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>변환 속성</title>
    </head>
    <body>
        
        <div id="b1">b1</div>
        <div id="b2">b2</div>
        <div id="b3">b2</div>
        <div id="b4">b3
        </div>
        
        <style>
            div{
                width: 50px;
                height: 50px;
                background-color: yellow;
                border: 1px solid black;
                text-align: center;
            }

            #b2{
                background-color: blue;
                transform: translate(100px, 0px);
            }
            #b3{
                background-color: red;
                transform: scale(1.2,1.5);
            }
            #b4{
                background-color: green;
                transform: rotate(30deg); /* deg, rad */
            }
        </style>
    </body>
</html>
