<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>lay out</title>
        <style>
            /* display 속성 실습 */
            #aa{display: inline;}
            #aa{display: inline-block; width: 300px;}

            img{ display: block;}

            #kk{display: none;}
        </style>
    </head>

    <body>
        <!-- display 속성 -->
         <p id="aa">hello world!</p>
         <a href="">good day</a>
         <strong>good morning</strong>

         <img src="./image/border.png" alt="image">
         <hr>
         <ul>
            <li>aaa</li>
            <li id="kk">bbb</li>
            <li>ccc</li>
         </ul>

         <hr>

         <!-- 블럭요소하고 인라인요소를 혼합하여 사용할때 고려할것들 -->

         <!-- 블럭요소 안에 인라인 요소를 넣을 수 있음 -->
        <div style="background-color: tomato; border: solid; padding: 5px;">
            nice <em>aaaa</em> world
        </div>

        <!-- 인라인요소 안에 블럭 요소는 넣을 수 없음 에러는 아니지만 이상해짐 -->
        <span style="background-color: teal; border: solid; padding: 5px;">
            nice <p>aaaa</p> world
        </span>
        
        <!-- 블럭요소 안에 블럭요소를 넣을 수 있음 -->
        <div style="background-color: azure; border: solid; padding: 5px;">
            nice <p>aaaa</p> world
        </div>

        <!-- 주의! 블럭 안에 같은 블럭 요소를 넣으면... -->
        <p style="background-color: aqua; border: solid; padding: 5px;">
            nice <p>aaaa</p> world
        </p>

        <h2 style="background-color: azure; border: solid; padding: 5px;">
            nice <h2>aaaa</h2> world
        </h2>

        <!-- div블럭요소 안에 div블럭요소가 존재하는 것은 허용됨 -->
        <div style="background-color: bisque; border: solid; padding: 5px;">
            nice <div>aaaa</div> world
        </div>

        <hr>

        <!-- position 속성 & 위치지정속성(left, right, top, bottom) -->
        <div class="region">
            <p id="p1">block #1</p>
            <p id="p2">block #2</p>
            <p id="p3">block #3</p>
        </div>

        <style>

            .region{
                background-color: black;
                position: relative;
            }

            #p1{
                background-color: brown;
                width: 200px;
                height: 50px;
            }
            #p2{
                position: static; /* 기본값: 원래 놓여져야 할 위치에 놓여짐 (정적위치) */
                position: relative; /* 원래 놓여질 위치에서 위치지정 속성값을 반영함 (상대위치) -> 위치지정 속성이 없으면 그려지지 않음 */
                position: absolute; /* 웹문서의 좌상단을 기준으로 배치 (절대위치) */
                /* 절대위치를 사용할때 부모요소의 position이 static이 아니면 부모요소의 좌상단을 기준으로 함 */
                position: fixed; /* 웹 브라우저창을 기준으로 배치(고정위치) */
                /* 위치지정 속성(position:static 에서는 무시됨) */
                /* left: 50px; */
                /* top: 30px; */
                right: 10px;
                bottom: 20px;


                background-color: yellow;
                width: 150px;
                height: 50px;
            }
            #p3{
                background-color: greenyellow;
                width: 200px;
                height: 50px;
            }
        </style>
    </body>
</html>
