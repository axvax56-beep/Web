<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>overflow</title>
        <style>
            .aaa p{
                background-color: green;
                width: 200px;
                height: 50px;
            }
            
            .aaa{
                border: 2px solid black;
                width: 300px;
                height: 100px;

                overflow: visible; /* 기본값 */
                overflow: hidden;
                overflow: scroll;
                overflow: auto;
            }
        </style>
    </head>
    <body>
        <div class="aaa">
            <p>b1</p>
            <p>b2</p>
            <p>b3</p>
            <p>b4</p>
            <p>b5</p>
        </div>
    </body>
</html>
