<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>canvas game</title>

    <script>
        //전역변수로서 이미지객체 준비
        var imgPlayer = new Image();
        imgPlayer.src = './image/ms15.png';

        // 플레이어가 표시될 이미지의 중심 좌표 변수
        var x =200, y = 250;
        // 플레이어의 사이즈를 동적으로 변경할 수도 있으니
        // 이미지의 절반 너비와 높이값을 저장
        var w= 40, h = 40;

        // 플레이어의 이동방향과 속도를 결정하는 변수 만들기
        var dx = 1, dy = 1;
        
        // 배경 이미지 준비
        var imgBg = new Image();
        imgBg.src='./image/bg.png';

        // 배경 이미지의 좌상단 좌표
        var bx = 0, by = 0;

        //전역변수로서 그림도구와 캔버스 준비
        var canvas;
        var context;

        // 이미지를 그려내는 작업은 body 영역의 로딩이 완료된 후 진행
        function loaded(){
            canvas = document.getElementById('c1');
            context = canvas.getContext('2d');

            // 게임을 진행하는 기능함수 호출
            runGame();
            // 10ms 마다 runGame()함수를 다시 호출
            setInterval(runGame,10);
        }

        function runGame(){
            moveAll();// 1. 움직이기
            drawAll();// 2. 이미지 그리기

            
        }

        function moveAll(){
            //배경 이미지 이동 (왼쪽으로)
            bx+=-1;
            if (bx <= -400) bx = 0;
            //플레이어 위치 이동
            x+= dx;
            y+= dy;

            // 벽에 닿으면 반대방향으로
            if(x<w || x>400-w) dx = -dx; //중괄호 안에 실행문이 한 줄일때는 중괄호 생략가능 + 옆에 써도됨
            if(y<h || y>500-h) dy = -dy;
        }

        function drawAll(){
            //배경 이미지 그리기
            context.drawImage(imgBg, bx, by , 400, 500)
            context.drawImage(imgBg, bx+400, by , 400, 500)

            //플레이어 이미지 그려내기
            context.drawImage(imgPlayer, x-w, y-h, w*2, h*2);
        }

        function down(){
            keyCode = window.event.keyCode;
            switch(keyCode){
                case 37: dx=-2; break // 왼쪽(번호가 37)으로 가기
                case 38: dy=-2; break // 위쪽(번호가 38)으로 가기
                case 39: dx=+2; break // 오른쪽(번호가 39)으로 가기
                case 40: dy=+2; break // 아래쪽(번호가 40)으로 가기
                
                    default: dx=1;dy=1; // 다른키를 누르거나 아무것도 안하면 자동으로 움직이기
            }
        }
        function up(){
            keyCode = window.event.keyCode;
            //방향키에서 손을 놓으면 멈추도록
            if(keyCode>=37 && keyCode<=40){
                dx=0; dy=0;
        }
    }
    </script>

</head>
<body onload="loaded()" onkeydown="down()" onkeyup="up()">
    
    <canvas id="c1" width="400" height="500" style="border: 2px solid black;"></canvas>

</body>
</html>
