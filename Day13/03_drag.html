<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>drag & drop</title>

    <style>
        #cart{
            width: 400px; height: 150px; padding: 10px; border: 1px dotted red;
        }
    </style>

    <script>
        // 카트 위로 올라갔는지 여부
        var isOver = false;
        function endDrag(){
            if(isOver){
                //드래그가 종료된 요소를 id를 기반으로 찾기
                var e = document.getElementById(window.event.target.id); //이벤트를 발생시키는 id의 값을 가져오겠다
                // cart 아이디를 가진 div 요소 안에 드래그한 요소를 자식으로 추가
                document.getElementById('cart').appendChild(e);
            }
        }    

        function overDrag(){
            //기본적으로 다른 요소가 내 위에 놓여지지 않도록 아이콘이 표시됨
            //이 기본 설정을 방지해보기
            window.event.preventDefault();
            isOver=true;
        }

        function leaveDrag(){
            isOver = false;
        }
    </script>
</head>
<body>
    
    <div id="cart" ondragover="overDrag()" ondragleave="leaveDrag()"></div>

    <img src="./image/ms18.png" alt="ms18" width="150" height="150" id="img1" ondragend="endDrag()">
    <img src="./image/ms21.png" alt="ms21" width="150" height="150" id="img2" ondragend="endDrag()">

</body>
</html>
