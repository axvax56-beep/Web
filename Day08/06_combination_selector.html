<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>combination selector</title>

    <style>
        body{background-color: #eeeeee;}
        /* 자손 선택자 */
        section p{background-color: white; padding: 1rem;}
        /* 자식 선택자 */
        section>p{color: red;}
        /* 인접형제 선택자 */
        section>h3+p{background-color: black; color: white;} /* h3 다음에 등장하는 첫번째 p요소 */
        /* 형제 선택자 */
        section>div h3~p{border-radius: 10px; box-shadow: 0px 1px 3px gray; color: blue;} /* h3 다음에 등장하는 모든 p요소 */
    </style>
</head>
<body>
    
    <h1>콤비네이션 선택자에 대해 알아보기</h1>

    <section>
        <h3>예약방법 & 사용요금</h3>
        <p>아직 온라인 예약신청이 준비되지 않았어요. 나중에 시도해주세요</p>
        <p>문의 연락처: 012-3456-7890</p>

        <hr>

        <div>
            <h3>ROOM 형태 및 이용가격 안내</h3>
            <p>가족실(2~4인): 60,000/일</p>
            <span>예약하기</span>
            <p>도미토리(4인 공용): 25,000/일</p>
            <span>예약불가</span>
        </div>
    </section>

</body>
</html>
