<!DOCTYPE html>
<html>
    <head>
        <title>게시판</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!-- 외부 스타일시트 연결 [경로 주의] -->
        <link rel="stylesheet" href="../css/view.css">

        <!-- 외부 스크립트 연결 -->
        <script src="../js/view.js"></script> 

    </head>
    <body>
        
        <!-- 페이지가 표시되는 영역 -->
        <div class="board_wrap">

            <!-- 1. 게시판 제목 영역 -->
            <div class="board_title">
                <h2>자유 게시판 - 상세글 보기</h2>
                <p>자유롭게 게시글을 작성하며 이야기를 나누세요.</p>
            </div>

            <!-- 2. 상세글이 그려질 영역 -->
            <div class="board_view">
                <!-- 2.1 게시글 제목 영역 -->
                 <div class="title">
                    <!-- [ JS or PHP 를 통해서 데이터를 표시 ] -->
                    글 제목 #1 
                 </div>

                <!-- 2.2 게시글 정보영역 (번호, 작성자, 작성일, 조회수)-->
                <div class="info">
                    <!-- 라벨과 값의 형태로 정보가 표현되므로 definition list로 만들어보기 [JS or PHP를 통해 정보 표시] -->
                    <dl>
                        <dt>번호</dt>
                        <dd class="col1">1</dd>
                    </dl>
                    <dl>
                        <dt>글쓴이</dt>
                        <dd class="col2">sam</dd>
                    </dl>
                    <dl>
                        <dt>작성일</dt>
                        <dd class="col3">2025.07.28</dd>
                    </dl>
                    <dl>
                        <dt>조회</dt>
                        <dd class="col4">10</dd>
                    </dl>
                </div>

                <!-- 2.3 글 내용 입력 -->
                <div class="content">
                    <!-- JS or PHP를 통해 데이터 표시 -->
                    Hello world <br>
                    Nice to meet you <br>
                    안녕하세요. <br>
                </div> 

            </div> 

            <!-- 3. 버튼들이 놓여지는 영역 -->
            <div class="board_btn">
                <a href="../index.html">목록</a>
                <a href="./edit.html">수정</a>
            </div>


        </div> 

    </body>
</html>
