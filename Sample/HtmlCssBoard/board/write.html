<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게시판</title>

     <!-- 외부 스타일시트 연결 [경로 주의 ../ ]-->
     <link rel="stylesheet" href="../css/write.css">
</head>
<body>

    <!-- 콘테츠가 표시되는 영역 -->
    <div class="board_wrap">

        <!--1. 게시판 제목 영역 -->
        <div class="board_title">
            <h2>자유 게시판 - 게시글 작성</h2>
            <p>자유롭게 게시글을 작성하며 이야기를 나누세요.</p>
        </div>

        <!-- 2. 게시글 작성의 컨테이너 영역(글작성 ,버튼 - form요소로 전송하기 위해 버튼영역도 작성영역에 포함) -->
        <div class="board_write_wrap">

            <!-- 서버에 작성내용을 보내야 하기에 form요소 배치 -->
            <form action="../backend/board/insertBoard.php" method="post">
                <!-- 2.1 게시글 작성 영역 -->
                <div class="board_write">
                    <!-- 2.1.1 제목 작성 영역 -->
                    <div class="title">
                        <div class="col_label">제목</div>                        
                        <div class="col_input"><input type="text" placeholder="제목입력"></div>
                    </div>

                    <!-- 2.1.2 글쓴이 / 비빌번호 입력 영역 -->
                    <div class="info">

                        <div class="writer">
                            <div class="col_label">글쓴이</div>                        
                            <div class="col_input"><input type="text" placeholder="글씬이 입력"></div>
                        </div>

                        <div class="password">
                            <div class="col_label">비밀번호</div>                        
                            <div class="col_input"><input type="password" placeholder="비밀번호 입력"></div>
                        </div>             
                        
                    </div>


                    <!-- 2.1.3 내용 입력 영역 -->
                    <div class="content">

                        <textarea name="msg" placeholder="내용 입력"></textarea>

                    </div>

                </div>


                <!-- 2.2 등록/취소 버튼 영역 -->
                <div class="btn_wrap">
                    <input type="submit" value="등록">
                    <a href="../index.html">취소</a>
                </div>

            </form>                        
        </div>


    </div>
    
</body>
</html>
