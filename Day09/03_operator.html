<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operator</title>

    <script>

        // 1. 산술연산자
        document.write(10+4)
        document.write('<br>')

        document.write(10 - 4)
        document.write('<br>')

        document.write(10*4)
        document.write('<br>')
        
        document.write(10/4)
        document.write('<br>')

        // 파이썬에 있던 몫을 구하는 연산자 // 는 없음. 나머지는 있음
        // JS에서 몫을 구하고 싶다면 나눗셈의 결과에서 소수점 아래를 날리면 됨

        document.write(parseInt(10/3))
        document.write('<br>')

        document.write(10%3)
        document.write('<br>')

        // 0 나눗셈 (파이썬에서는 에러 JS에서는 '무한대' 출력)
        document.write(10/0)

    </script>
</head>
<body>
    
</body>
</html>
