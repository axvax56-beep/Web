<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control</title>

    <script>
        // 제어문
        // 1. if 문
        var age = 15
        if(age<20){
            document.write('미성년자입니다')
        }
        document.write('<br>');

        // 짝수인지 홀수인지

        var num = 25
        if(num%2 == 0){
            document.write('even number')
        }else{
            document.write('odd number')
        }
        document.write('<br>')

        // 점수에 따른 학점 출력

        var score = 75
        if(score>=90){
            document.write('A학점 <br>')
        }else if(score >= 80){
            document.write('B학점 <br>')
        }else if(score >= 70){
            document.write('C학점 <br>')
        }else if(score >= 60){
            document.write('D학점 <br>')
        }else{
            document.write('F학점 <br>')
        }
        document.write('<hr>')

        // 2. switch 문
        // if 조건문의 == 비교를 조금 더 가독성 좋게 하는 문법(분기문)
        var menu=1
        switch(menu){
            case 1:
                document.write('walking')
                break
            case 2:
                document.write('running')
                break
            case 3:
                document.write('rest')
                break
            default:
                document.write('wrong menu')
        }
        document.write('<hr>')

        // -------------------------

        // 3. while 문

        // 4. for 문
    </script>
</head>
<body>
    
</body>
</html>
