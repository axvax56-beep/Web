<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Event Handling</title>

    <!-- 내부스크립트 -->
    <script>
        // body 안에 있는 h2 요소에 글씨를 추가하기 -> 실행되지 않음 html은 body 영역보다 head 영역을 먼저 실행함
        // 그래서 head 영역이 실행될 때 head보다 밑에 있는 body에 있는 h2 요소를 찾을 수 없음
        var h2 = document.getElementById('aa');
        h2.innerHTML = 'Hello';

        // 위 동작이 되려면 body 영역의 요소들이 모두 만들어진 후 수행해야 함
        // 그래서 body 요소에 문서로딩이 완료되었을때 발생하는 load 이벤트를 처리하기
        function loaded(){
            var h2 = document.getElementById('aa');
            h2.innerHTML = 'Hello';
        }

    </script>

    <!-- 실무에서는 외부 스크립트를 더 선호하며 외부 스크립트를 사용한다면 defer 속성으로 onload 이벤트를 대신할 수 있음 -->
    <script src="./aa.js" defer></script>
    <!-- defer 속성은 외부스크립트만 가능함. 내부스크립트에서는 적용되지 않음 -->
</head>
<body onload="loaded()"> //인라인 방식
    
    <h2 id ='aa'></h2>
    <h3 id ='bb'>nice to meet you</h3>

    <hr>

    <!-- 이벤트 처리함수를 등록하는 또 다른 방법 (JS로 요소를 찾아서 이벤트 처리)-->
    <button id="btn">click me</button>

    <!-- 또 다른 이벤트 등록 방법 (제일 권장) -->
    <button class="kk">버튼</button>

</body>
</html>
