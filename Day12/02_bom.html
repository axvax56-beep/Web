<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS BOM</title>
</head>
<body>
    <!-- BOM: 브라우저를 관리하는 내장된 JS 객체들 -->
    <!-- 1. window: 최상위 객체(브라우저 창 전체를 관리) -->

    <!-- 주요 기능들 -->
    <!-- 1-1. open(), close(): 새로운 웹문서를 열고 닫기 -->
    <button onclick="aaa()">naver</button>
    <script>
        function aaa(){
           // window.open('https://www.naver.com'); // 기본값이 새탭으로 열림 [target='_balnk']
           // window.open('https://www.naver.com', '_self'); // 두번째 파라미터 생성 [target]

           // 세번째 파라미터로 옵션을 추가하면 새 창으로 웹문서를 열 수 있음
           var option = 'width=500, height=200, left=200, top=200'; // aaa 함수의 지역변수
           window.open('https://www.naver.com', '_blank', option); // window.open(URL, 창이 열릴 방법, 추가하고 싶은 옵션)
        }
    </script>
    <hr>

    <button onclick="bbb()">메세지 윈도우창 띄우기</button>
    <button onclick="ccc()">메세지 윈도우창 닫기</button>
    <script>
        var win; //전역 함수 생성
        function bbb(){
            win = window.open('','','width=500, height=200, left=200, top=200');// 새 창의 객체는 win 객체가 처리
            win.document.write('<h2>hello new window</h2>'); //전역 함수안에 값 넣기
        }

        function ccc(){
            win.close();
            win = undefined;
        }
    </script>
    <hr>
    <!-- 윈도우 창 이동시키기 -->
    <button onclick="eee()">open window</button>
    <button onclick="fff()">move window</button>
    <script>
        var win;
        function eee(){
            win = window.open('','','width=400, height=200');
            win.document.write('오늘의 특가 세일 제품!');
            // 어디와는 상관없이 특정 위치로 이동
            win.moveTo(300,100); //(x축, y축)
        }
        function fff(){
            // 현재위치 기준으로 조금씩 이동
            win.moveBy(10, 20) //(x축, y축)
            // 이동시킬때 브라우저창이 앞으로 보이게
            win.focus();
        }
    </script>
    <hr>

    <!-- 1-2. setTimeout(function, ms): 일정시간(ms) 후에 특정 함수(function)가 실행-->
    <button onclick="ggg()">3초 후에 경고창 띄우기</button>
    <script>
        function showAlert(){
            alert('3초 경과!!!')
        }

        function ggg(){
            // 3초 후에 showAlert라는 이름의 함수를 실행
            window.setTimeout(showAlert, 3000) // 3000ms -> 3초
        }
    </script>
    <br>
    <!-- setInterval(function , ms): 함수(function)을 일정시간(ms)마다 실행 -->
    <h3 id="hh">0</h3>
    <button onclick="hhh()">1초마다 카운트 증가 시작</button>
    <button onclick="iii()">카운트 종료</button>
    
    <script>
        var interval_id;
        function showCount(){
            // h3요소에 써있는 숫자에 1더하기
            var h3 = document.querySelector('#hh');
            // h3.innerHTML = h3.innerHTML + 1 // A.innerHTML : A안에 있는 문자 -> 문자열이기 때문에 1이 계속 결합됨
            h3.innerHTML = parseInt(h3.innerHTML) + 1; // 숫자열로 바꾸기
        }

        function hhh(){
            // 1초마다 showCount 라는 이름의 함수를 실행
            interval_id = window.setInterval(showCount,1000); //식별자 리턴됨
        }
        function iii(){
            window.clearInterval(interval_id);
        }
    </script>
    <hr>

    <!-- 기타 유용한 메소드들 -->
    <script>
        // 웹브라우저의 인터넷 주소창의 URL은 기본적으로 한글이나 띄어쓰기같은 문자는 사용못함
        // 그래서 만약 한글이나 띄어쓰기 또는 특수문자 중 일부를 사용하고 싶다면
        // URL에서 인식가능한 문자로 변환해야함.. 이를 url encoding 이라고 함

        // 인코딩을 해주는 기능을 window 최상위 객체가 가지고 있음
        // var a = window.encodeURI('http://www.aaa.com/가나다 마바사.html');
        // 최상위 객체 window 키워드는 생략해도 됨
        var a = encodeURI('http://www.aaa.com/가나다라 마바사.html'); //파일명이 한글과 띄어쓰기 -> 사용못함
        document.write('인코딩된 URL: ' + a +'<br>');
        
        // 반대로 인코딩된 URL을 해독(decode)해주는 기능도 있음
        var b = decodeURI(a);
        document.write('디코딩된 URL: ' + b + '<hr>');

        // eval(): 문자열 데이터를 JS코드인것처럼 해독하여 실행해주는 기능
        var x = 10+2*6;
        document.write(x + '<br>');


        var x = '10+2*6';
        document.write(x + '<br>');

        var x = eval('10+2*6');
        document.write(x + '<br>');

        //숫자로 변환이 가능한 모양이 아닌지 확인해주는 기능 -> 모양이 아니면 true 모양이 맞으면 false -> paseInt 전에 확인용
        document.write( isNAN(10) + '<br>'); //false
        document.write( isNAN('10') + '<br>'); //false
        document.write( isNAN('hello') + '<br>'); //false

        // 내장함수인줄 알고 사용했던 모드 기능들은 사실 window의 멤버함수임
        // window.alert();
        // window.prompt();
    </script>
    <hr>

    <!-- window 취상위 객체의 멤버 변수들 중 주요한 객체들 소개 -->
    <!-- 2. document: 웹 문서를 관리하는 여러 기능을 가진 객체  -->
    <script>
        //원래는 window의 멤버이기에
        window.document.write('이게 원래 코드 문법 <br>');
    </script>
    <hr>

    <!-- 3. screen: 모니터 사이즈 -->
    <script>
        // 모니터의 해상도 정보
        document.write('모니터 해상도: ' + screen.width + "*" + screen.height + '<br>');
        document.write('작업표시줄 제외한 모니터 해상도: ' + screen.availWidth + "*" + screen.availHeight + '<br>');

        // 웹브라우저 창의 해상도는 window 객체가 가지고 있는 정보
        document.write('웹브라우저의 창의 크기: ' + window.outerWidth + "*" + window.outerHeight +'<br>');
        document.write('document 영역의 크기: ' + window.innerWidth + "*" + window.innerHeight +'<br>');
    </script>
    <hr>

    <!-- 버튼으로 전체화면 확대할때 활용 -->
    <button onclick="jjj()">전체화면 윈도우</button>
    <script>
        function jjj(){
            var option = 'width=' + screen.availWidth + ", height=" + screen.availHeight;
            open('', '', option);
        }
    </script>

    <hr>

    <!-- 4. location: URL 정보 관리 객체 -->
    <script>
        // location 객체의 주요 멤버변수(속성)
        document.write(location.href + '<br>');
        document.write(location.protocol + '<br>');
        document.write(location.pathname + '<br>');
    </script>

    <!-- location 객체의 주요 기능함수들 -->
    <button onclick="mmm()">새로운 문서 열기</button>
    <button onclick="kkk()">새로운 문서 대체하여 열기</button>
    <button onclick="nnn()">현재 문서 다시 열기(새로고침)</button>

    <script>
        function mmm(){
            // location.assign('https://www.naver.com'); // 뒤로가기 버튼 활성화
            // URL을 바꾸는 것이기에 함수대신 속성값을 변경해도 됨
            location.href = 'https://www.naver.com';
        }
        function kkk(){
            location.replace('https://www.naver.com'); // 기존 문서가 없어짐 즉, 뒤로가기 없음
        }
        function nnn(){
            location.reload('https://www.naver.com'); //새로고침 F5
        }
    </script>
    <hr>

    <!-- 5.history: 방문한 URL 정보를 가지고 있음 -->
    <script>
        document.write('방문한 페이지 수: ' + history.length + '<br>');
    </script>

    <button onclick="history.back">뒤로</button>
    <button onclick="history.forward">앞으로</button>
    <button onclick="history.go(-2)">두칸 뒤로</button>

    <hr>

    <!-- 6. navigator: 브라우저의 정보 관리 객체 -> 나중에 새로운 기능들이 이 객체의 하위멤버로 추가됨(위치기반서비스, 웹캠) -->
    <script>
        document.write( navigator.appCodeName + '<br>');
        document.write( navigator.appName + '<br>');
        document.write( navigator.appVersion + '<br>');
        document.write( navigator.platform + '<br>'); // 사용자가 접속하는 환경을 파악하여 대응이 가능
        document.write( navigator.userAgent + '<br>');
    </script>
</body>
</html>
