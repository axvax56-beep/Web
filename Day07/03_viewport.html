<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>viewport</title>

        <!-- 뷰포트: 웹 브라우저가 화면을 그려내는 가상의 영역 -->
        <!-- 데스크탑 브라우저는 창의 크기에 따라 너비가 맞추어 변경됨 -->
        <!-- 모바일 브라우저는 디바이스의 크기와 상관없이 무조건 980px로 너비를 인식함 -->
        <!-- 그렇기에 css로 적용한 너비가 다르게 보여짐(작게 보임) -->
        <!-- 그래서 모바일 UI를 제작할때는 viewport를 설정해줘야함 -->
        <!-- <meta name="viewport" content="width=400, initial-scale=1.0"> -->
        <!-- <meta name="viewport" content="width=600, initial-scale=1.0"> -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <h2>view port</h2>
        <p>this is view port</p>
    </body>

    <img src="../Day06/image/forest.jpg" alt="forest image" style= "width:200px; border: 1px dotted red;"">
</html>
